<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | InternHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="card auth-card">
    <h1>Student Login</h1>
    <p>Sign in to discover internships and track your applications.</p>
    <form id="login-form" class="form-grid">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@college.edu">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="auth-footer">No account? <a href="register.html">Register here</a></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
