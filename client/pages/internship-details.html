<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Details | InternHub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth()) throw new Error("Auth required");
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (!id) {
      window.location.href = "internships.html";
    }

    mountAppShell("internships", "Internship Details", `<div id="detail-root" class="loading-state">Loading...</div>`);

    async function loadDetails() {
      const item = await API.apiRequest(`/internships/${id}`);
      const skills = (item.skills || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      document.getElementById("detail-root").innerHTML = `
        <section class="detail-grid">
          <article class="card detail-panel">
            <div class="internship-meta">
              ${workModeBadge(escapeHtml(item.work_mode))}
              <span class="badge">${escapeHtml(item.source)}</span>
              <span class="badge">${escapeHtml(item.application_method)}</span>
            </div>
            <h2>${escapeHtml(item.title)}</h2>
            <p><strong>${escapeHtml(item.company_name)}</strong> · ${escapeHtml(item.location) || "N/A"}</p>
            <p>${escapeHtml(item.description) || "No description provided."}</p>
            <h3>Required Skills</h3>
            <div class="chip-list">${skills.map((s) => `<span class="chip">${escapeHtml(s)}</span>`).join("") || "<span>No skills listed</span>"}</div>
            <h3>Eligibility</h3>
            <p>${escapeHtml(item.eligibility) || "See listing details."}</p>
          </article>
          <aside class="card side-panel">
            <p><strong>Duration:</strong> ${escapeHtml(item.duration) || "N/A"}</p>
            <p><strong>Stipend:</strong> ${escapeHtml(item.stipend) || "N/A"}</p>
            <p><strong>Deadline:</strong> ${formatDate(item.deadline)}</p>
            <div style="display:flex;flex-direction:column;gap:0.6rem;margin-top:1rem">
              <button class="btn btn-secondary" id="save-btn">${item.is_saved ? "Saved" : "Save Internship"}</button>
              ${item.application_method !== "external" ? `
              <div class="form-group" style="margin-top:0.8rem">
                <label for="cover-note" style="font-weight:600;display:block;margin-bottom:0.4rem">
                  Cover Note <span style="color:var(--muted);font-weight:400">(optional)</span>
                </label>
                <textarea id="cover-note" class="form-group"
                  style="width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:10px;font:inherit;min-height:80px;resize:vertical"
                  placeholder="Tell them why you're a great fit..."></textarea>
              </div>` : ""}
              <button class="btn btn-primary" id="apply-btn">${item.application_method === "external" ? "Apply on Original Site" : "Apply Now"}</button>
              <div id="email-box"></div>
            </div>
          </aside>
        </section>
      `;

      document.getElementById("save-btn").addEventListener("click", async () => {
        await API.apiRequest(`/saved-internships/${id}`, { method: "POST" });
        showToast("Saved to your list", "success");
      });

      document.getElementById("apply-btn").addEventListener("click", async () => {
        if (item.application_method === "external") {
          if (item.application_url) {
            window.open(item.application_url, "_blank", "noopener");
          } else {
            showToast("External URL not available", "error");
          }
          return;
        }
        try {
          const data = await API.apiRequest("/applications", {
            method: "POST",
            body: JSON.stringify({
              internship_id: Number(id),
              cover_note: document.getElementById("cover-note")?.value?.trim() || null,
            }),
          });
          showToast(`Applied! ID: ${data.application.application_code}`, "success");
          const mail = data.application.email || {};
          const box = document.getElementById("email-box");
          if (mail.sent) {
            showToast(`Confirmation email sent to ${mail.to || "your email"}`, "success");
            box.innerHTML = `<p style="color:var(--muted);font-size:0.9rem">A confirmation email was sent to ${escapeHtml(mail.to)}.</p>`;
          } else {
            showToast("Application saved. Email could not be sent yet.", "info");
          }
        } catch (err) {
          showToast(err.message, "error");
        }
      });
    }

    loadDetails().catch((err) => {
      document.getElementById("detail-root").className = "error-state";
      document.getElementById("detail-root").textContent = err.message;
    });
  </script>
</body>
</html>
